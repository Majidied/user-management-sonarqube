name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Maven Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run Tests & Package
        run: ./mvnw -B verify

      - name: Build Docker Image
        run: docker build -t majidied/user-management-sonarqube:${{ github.sha }} .

  sonarqube-and-deploy:
    name: SonarQube, Push & Kubernetes Rollout
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: SonarQube Static Analysis
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          ./mvnw -B verify sonar:sonar \
            -Dsonar.project.settings=./sonar-project.properties \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

      - name: Build and Push Docker Image
        if: secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != ''
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t majidied/user-management-sonarqube:latest .
          docker push majidied/user-management-sonarqube:latest

      - name: Deploy to Kubernetes
        if: hashFiles('k8s/deployment.yaml') != '' && secrets.KUBECONFIG_CONTENT != ''
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBECONFIG_CONTENT }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config use-context docker-desktop
          kubectl config set-context --current --namespace=ensakh
          kubectl apply -f k8s/deployment.yaml
          kubectl get pods
